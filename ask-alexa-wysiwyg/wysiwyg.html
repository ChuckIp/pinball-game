<script>
    // Init WYSIWYG Styling and JS
    const initWysiwygPinball = () => {
        const ELEMENTS = {
            IFRAME : 'resourceobject',
            TOTARA_NAV : '.totaraNav'
        };

        const iframe = document.getElementById(ELEMENTS.IFRAME),
            totaraNav = document.querySelector(ELEMENTS.TOTARA_NAV);

        if (!iframe) {
            return false;
        }

        // Creates a new stylesheet and appends it to the head of the document.
        const createStylesheet = () => {
            $('style').text(`
                .activityheader .h3 {
                    display: none;
                }
            `).appendTo('head');
        }

        // Resize the iframe
        const resizeIframe = () => {
            let headerHeight = 0;

            // Calculate the height of the nav header
            if (totaraNav && totaraNav.offsetHeight) {
                headerHeight = totaraNav.offsetHeight;
            }

            // For small mobile screens to remove black bars
            if (window.innerWidth <= 320) {
                headerHeight = 100
            }

            iframe.style.height = `calc(100vh - ${headerHeight}px)`;
            iframe.style.width = '575px';
        }

        // Initialise the JS
        const init = () => {
            createStylesheet();
            resizeIframe();

            // Add an event listener to the iframe, once loaded resize the iframe
            iframe.addEventListener("load", function(){
                setTimeout(() => {
                    resizeIframe();
                }, '100')
            });

            // On window resize, resize iframe
            window.addEventListener('resize', function() {
                resizeIframe();
            });
        }

        init();
    }

    initWysiwygPinball();
</script>
